<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Booking - Driver WebSocket</title>
    <!-- SockJS -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.1.4/dist/sockjs.min.js"></script>
    <!-- STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h2>Driver WebSocket Test</h2>
<p id="connectionStatus">Connecting...</p>

<button onclick="acceptRide()">Accept Ride</button>
<button onclick="rejectRide()">Reject Ride</button>

<h3>Ride Request</h3>
<pre id="rideRequest">No ride request received</pre>
<script>
    let stompClient = null;

    // Ask for Driver ID when opening the page.
    // This allows us to test multiple drivers using multiple tabs.
    const driverId = Number(prompt("Enter Driver Id"));

    // Stores the latest booking received by this driver.
    let currentBookingId = null;

    // Page load
    document.addEventListener("DOMContentLoaded", () => {connect();});

    // CONNECT TO SOCKET SERVICE
    function connect() {
        console.log("Connecting as Driver:", driverId);
        const socket = new SockJS("http://localhost:8080/websocket");
        stompClient = Stomp.over(socket);

        stompClient.connect({},

            function (frame) {
                console.log("Connected:", frame);
                console.log("Driver ID:", driverId);
                document.getElementById("connectionStatus").innerText = "Connected as Driver " + driverId;

                // DRIVER-SPECIFIC TOPIC
                const topic = "/topic/rideRequest/" + driverId;
                console.log("Subscribing to:", topic);

                // SUBSCRIBE TO RIDE REQUEST
                stompClient.subscribe(topic,

                    function (message) {
                        console.log("MESSAGE RECEIVED");
                        console.log("Driver:", driverId);
                        console.log("Message:", message.body);

                        // Convert JSON string to JavaScript object
                        const data = JSON.parse(message.body);

                        // CHECK IF THIS IS A CANCELLATION MESSAGE
                        if (data.message) {
                            console.log("RIDE CANCELLED:", data.message);

                            document.getElementById("rideRequest").innerText = "Booking " + data.bookingId + ": " + data.message;

                            // Remove current booking so driver cannot accept it anymore.
                            if (currentBookingId === data.bookingId) {
                                currentBookingId = null;
                            }
                            return;
                        }

                        // NORMAL RIDE REQUEST
                        console.log("RIDE REQUEST RECEIVED");
                        console.log("Booking ID:", data.bookingId);
                        console.log("Nearby Driver IDs:", data.driverIds);

                        // Store booking ID
                        currentBookingId = data.bookingId;

                        // Display ride request
                        document.getElementById("rideRequest").innerText = JSON.stringify(data, null, 2);
                    }
                );

                console.log("Successfully subscribed to:", topic);
            },

            // CONNECTION ERROR
            function (error) {
                console.error("WebSocket connection error:", error);

                document.getElementById("connectionStatus").innerText = "Connection failed";
            }
        );
    }

    // ACCEPT RIDE
    function acceptRide() {
        if (currentBookingId === null) {
            alert("No ride request available");
            return;
        }

        const rideResponse = {
            response: true,
            bookingId: currentBookingId
        };


        // Example:
        // Driver 1 -> /app/rideResponse/1
        // Driver 2 -> /app/rideResponse/2
        // Driver 3 -> /app/rideResponse/3

        const destination = "/app/rideResponse/" + driverId;

        console.log("Sending ACCEPT to:", destination);
        console.log("Ride response:", rideResponse);

        stompClient.send(destination, {}, JSON.stringify(rideResponse));

        console.log("Ride accepted:", rideResponse);
    }

    // REJECT RIDE
    function rejectRide() {
        if (currentBookingId === null) {
            alert("No ride request available");
            return;
        }

        const rideResponse = {
            response: false,
            bookingId: currentBookingId
        };


        const destination = "/app/rideResponse/" + driverId;
        console.log("Sending REJECT to:", destination);
        console.log("Ride response:", rideResponse);

        stompClient.send(destination, {}, JSON.stringify(rideResponse));

        console.log("Ride rejected:", rideResponse);
    }

</script>

</body>
</html>
