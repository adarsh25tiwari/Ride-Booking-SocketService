<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ride Booking - Driver WebSocket</title>
    <script src="https://cdn.jsdelivr.net/sockjs/1.1.4/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>

<h2>Driver WebSocket Test</h2>
<p id="connectionStatus">Connecting...</p>

<button onclick="acceptRide()">Accept Ride</button>
<button onclick="rejectRide()">Reject Ride</button>

<h3>Ride Request</h3>
<pre id="rideRequest">No ride request received</pre>

<script>
    let stompClient = null;
    // We are pretending to be Driver 3
    const driverId = 3;
    // Store the latest booking received from Socket Service
    let currentBookingId = null;
    document.addEventListener("DOMContentLoaded", () => {
        connect();
    });
    function connect() {
        const socket = new SockJS(
            "http://localhost:8080/websocket"
        );

        stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
                console.log("Connected: " + frame);
                document.getElementById("connectionStatus").innerText = "Connected as Driver " + driverId;
                // Subscribe to ride requests

                stompClient.subscribe("/topic/rideRequest", function (message) {
                        console.log("Ride request received:", message.body);
                        const rideRequest = JSON.parse(message.body);
                        console.log("Driver IDs:", rideRequest.driverIds);
                        console.log("Booking ID:", rideRequest.bookingId);

                        // Check whether this ride was sent to this driver
                        if (rideRequest.driverIds && rideRequest.driverIds.includes(driverId)) {
                            currentBookingId = rideRequest.bookingId;
                            document.getElementById("rideRequest").innerText =
                                JSON.stringify(rideRequest, null, 2);

                            console.log("Ride request is for Driver " + driverId);
                        } else {
                            console.log("Ride request is not for Driver " + driverId);
                        }
                    }
                );
            },
            function (error) {
                console.error("WebSocket connection error:", error);
                document.getElementById("connectionStatus").innerText = "Connection failed";
            }
        );
    }


    function acceptRide() {
        if (currentBookingId === null) {
            alert("No ride request available");
            return;
        }
        const rideResponse = {
            response: true,
            bookingId: currentBookingId
        };

        stompClient.send("/app/rideResponse/" + driverId, {}, JSON.stringify(rideResponse));
        console.log("Ride accepted:", rideResponse);
    }


    function rejectRide() {
        if (currentBookingId === null) {
            alert("No ride request available");
            return;
        }
        const rideResponse = {
            response: false,
            bookingId: currentBookingId
        };

        stompClient.send("/app/rideResponse/" + driverId, {}, JSON.stringify(rideResponse));
        console.log("Ride rejected:", rideResponse);
    }

</script>

</body>
</html>
